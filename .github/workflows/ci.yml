name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

# Cancel superseded runs of the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ml.txt
      # requirements.txt already provides pytest; requirements-ml.txt is needed
      # by the price-forecast tests. No secrets or external services required:
      # tests/conftest.py defaults DATABASE_URL to in-memory SQLite.
      - run: pip install -r requirements.txt -r requirements-ml.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Informational for now: the validator currently exits non-zero because
      # ~760 translation values are still identical to English (some are
      # legitimate, e.g. "GST") and `ur` has extra keys. Remove
      # `continue-on-error` once those are triaged so it becomes a hard gate.
      - run: npm run i18n:validate
        continue-on-error: true
      - run: npm run build
